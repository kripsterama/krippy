<style>
/* Layout: one full-bleed particle field that reacts to the pointer; name top-left, links top-right,
   caption and form switches pinned bottom-left. Single dark look by design. */
:root {
  --ink: #08070f;
  --fg: #f3eefb;
  --muted: #a8a0bc;
  --line: rgba(243, 238, 251, 0.18);
  --amber: #ffb957;
  --rose: #ff5d8f;
  --font-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
html { touch-action: none; overscroll-behavior: none; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ape {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
  opacity: 0; transition: opacity 0.7s;
  -webkit-mask-image: linear-gradient(to bottom, #000 52%, transparent 74%);
  mask-image: linear-gradient(to bottom, #000 52%, transparent 74%);
}
#ape.show { opacity: 1; }
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(8, 7, 15, 0.88), rgba(8, 7, 15, 0) 40%),
    radial-gradient(ellipse at 50% 45%, rgba(8, 7, 15, 0) 55%, rgba(8, 7, 15, 0.7) 100%);
}
.shell {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 20px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  -webkit-user-select: none; user-select: none;
}
.shell a, .shell button { pointer-events: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mark { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em; }
.mark span { color: var(--amber); }
.links { display: flex; flex-wrap: wrap; column-gap: 18px; row-gap: 0; }
.links a {
  color: var(--muted); text-decoration: none; font-size: 0.75rem;
  text-transform: uppercase; letter-spacing: 0.1em; padding: 12px 0;
  transition: color 0.2s;
}
.links a:hover { color: var(--fg); }
.bottom { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.caption { max-width: 34rem; min-width: 0; transition: opacity 0.22s, transform 0.22s; }
.caption.swap { opacity: 0; transform: translateY(6px); }
.eyebrow { margin: 0 0 8px; color: var(--amber); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; }
h1 {
  margin: 0 0 10px; font-family: var(--font-display); font-weight: 500;
  font-size: clamp(1.5rem, 5.2vw, 2.75rem); line-height: 1.08; letter-spacing: -0.01em;
  text-wrap: balance;
}
.line { margin: 0; color: var(--fg); opacity: 0.86; font-size: 0.9rem; line-height: 1.55; }
.go {
  display: inline-block; margin-top: 12px; padding: 10px 0; color: var(--amber);
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
  text-decoration: none; border-bottom: 1px solid var(--amber);
}
.go[hidden] { display: none; }
.go:hover { color: var(--fg); border-bottom-color: var(--fg); }
.forms { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 0; }
.forms button {
  appearance: none; background: none; border: 0; border-top: 2px solid var(--line);
  color: var(--muted); font: 500 0.72rem var(--font-mono);
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 12px 0 10px; min-height: 44px; cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.forms button:hover { color: var(--fg); }
.forms button.toggle {
  display: inline-flex; align-items: center; justify-content: flex-end; margin-left: auto;
  min-width: 44px; border-top-color: transparent; opacity: 0.6;
}
.forms button.toggle:hover { opacity: 1; }
.forms button[aria-pressed="true"] { color: var(--fg); border-top-color: var(--amber); }
.shell a:focus-visible, .shell button:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }
.hint { margin: 0; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.02em; transition: opacity 0.6s; }
.hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .caption, .hint, .links a, .forms button { transition: none; }
}

<script>
(() => {
  const canvas = document.getElementById('field');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, D = 3.4, CY = 0.46;
  const BG = [8 / 255, 7 / 255, 15 / 255];

  let gl = null, ctx2 = null;
  try {
    gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  } catch (e) { gl = null; }
  if (!gl) ctx2 = canvas.getContext('2d');
  let glLost = false;
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true; });
  canvas.addEventListener('webglcontextrestored', () => { initGL(); glLost = false; clearAll(); });

  const small = Math.min(innerWidth, innerHeight) < 700 || matchMedia('(pointer: coarse)').matches;
  const N = gl ? (small ? 16000 : 38000) : 5000;
  const MIN_ACTIVE = Math.min(N, small ? 6000 : 9000);
  let active = N;

  const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const col = new Float32Array(N * 3), cb = new Float32Array(N * 3);
  const rnd = new Float32Array(N), size = new Float32Array(N);
  for (let i = 0; i < N; i++) { rnd[i] = Math.random(); const r = Math.random(); size[i] = 1.2 + r * r * r * 2.8; }

  let W = 1, H = 1, DPR = 1, S = 1, ax = 1, ay = 1;

  /* ---------- copy for each form ---------- */
  const forms = [
    { eyebrow: "Hello, I'm", title: 'Krippy', line: 'Enterprise AI executive and crypto native.', flat: true, pitch: 0, ps: 0.12, pa: 1.2 },
    { eyebrow: 'London, 2004 to 2011', title: 'Capital Markets', line: 'I started out building trading platforms for exchanges, hedge funds and brokerages.', flat: true, pitch: 0.05, ps: 0.16, pa: 1.1 },
    { eyebrow: 'Today', title: 'Life Sciences', line: 'I bring agentic AI to pharma, one of the most regulated industries there is.', flat: false, pitch: 0.12, ps: 0.25, pa: 2.2 },
    { eyebrow: 'Since 2013', title: 'On-chain', line: 'Hands-on in crypto for over a decade: DeFi lending and NFTs.', flat: true, pitch: 0, sway: 0.1, ps: 0.14, pa: 2.2 },
    { eyebrow: 'Now', title: 'Agents', line: 'I build with frontier AI models.', flat: false, pitch: 0.18, ps: 0.45, pa: 3 },
    { eyebrow: 'Now playing', title: 'Music Box', line: 'Tap to start the music. It already has a seat in music therapy sessions.', url: 'https://kripsterama.github.io/musicbox/', cta: 'Open Music Box ↗', flat: true, pitch: 0.3, ps: 0.3, pa: 2.4 }
  ];
  forms.forEach(f => { f.t = new Float32Array(N * 3); f.c = new Float32Array(N * 3); f.p = new Float32Array(N); });

  const put = (f, i, x, y, z, r, g, b, ph) => {
    const j = i * 3;
    f.t[j] = x; f.t[j + 1] = y; f.t[j + 2] = z;
    f.c[j] = r; f.c[j + 1] = g; f.c[j + 2] = b;
    f.p[i] = ph;
  };
  const R = Math.random;
  const J = a => (R() - 0.5) * a;

  /* ---------- form 0: the wordmark, sampled from real type ---------- */
  let glyph = null;
  function sampleWord() {
    const cw = 1400, ch = 520, c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const g = c.getContext('2d', { willReadFrequently: true });
    const fam = '"Unbounded", "Arial Black", Impact, sans-serif';
    let fs = 300;
    g.font = `800 ${fs}px ${fam}`;
    const m = g.measureText('krippy').width || 1;
    fs = Math.floor(fs * Math.min(1, (cw - 80) / m));
    g.font = `800 ${fs}px ${fam}`;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
    g.fillText('krippy', cw / 2, ch * 0.62);
    const d = g.getImageData(0, 0, cw, ch).data;
    const xs = [], ys = [];
    let x0 = cw, x1 = 0, y0 = ch, y1 = 0;
    for (let y = 0; y < ch; y += 2) for (let x = 0; x < cw; x += 2) {
      if (d[(y * cw + x) * 4 + 3] > 128) {
        xs.push(x); ys.push(y);
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (xs.length < 50) return null;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hw = (x1 - x0) / 2;
    const pts = new Float32Array(xs.length * 2);
    for (let i = 0; i < xs.length; i++) { pts[i * 2] = (xs[i] - cx) / hw; pts[i * 2 + 1] = -(ys[i] - cy) / hw; }
    return pts;
  }
  function buildWord(f) {
    const hw = Math.min(ax * 0.86, 1.3);
    const A = [1.0, 0.72, 0.28], B = [1.0, 0.32, 0.56], C = [0.56, 0.42, 1.0];
    const n = glyph ? glyph.length / 2 : 0;
    for (let i = 0; i < N; i++) {
      let nx, ny;
      if (n) { const k = (R() * n) | 0; nx = glyph[k * 2]; ny = glyph[k * 2 + 1]; }
      else { const a = R() * TAU; nx = Math.cos(a) * 0.5; ny = Math.sin(a) * 0.5; }
      const u = (nx + 1) / 2;
      let r, g, b;
      if (u < 0.5) { const t = u * 2; r = A[0] + (B[0] - A[0]) * t; g = A[1] + (B[1] - A[1]) * t; b = A[2] + (B[2] - A[2]) * t; }
      else { const t = (u - 0.5) * 2; r = B[0] + (C[0] - B[0]) * t; g = B[1] + (C[1] - B[1]) * t; b = B[2] + (C[2] - B[2]) * t; }
      put(f, i, nx * hw + J(0.006), ny * hw + J(0.006), J(0.07), r, g, b, u);
    }
  }

  /* ---------- form 1: a candlestick chart ---------- */
  function buildCandles(f) {
    const K = ax < 1.3 ? 9 : 15, hw = Math.min(ax * 0.82, 1.25), step = 2 * hw / K, bw = step * 0.56;
    let seed = 11;
    const r = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const cs = []; let p = 0, lo = 1e9, hi = -1e9;
    for (let k = 0; k < K; k++) {
      const o = p, c = o + (r() - 0.38) * 1.0;
      const h = Math.max(o, c) + r() * 0.45, l = Math.min(o, c) - r() * 0.45;
      p = c; cs.push([o, c, h, l]); if (l < lo) lo = l; if (h > hi) hi = h;
    }
    const sy = v => ((v - lo) / (hi - lo) - 0.5) * 1.0;
    for (let i = 0; i < N; i++) {
      const k = i % K, cd = cs[k], up = cd[1] >= cd[0];
      const x0 = -hw + step * (k + 0.5);
      let o = sy(cd[0]), c = sy(cd[1]);
      if (Math.abs(c - o) < 0.035) { const m = (o + c) / 2; o = m - 0.018; c = m + 0.018; }
      let x, y, z;
      if (R() < 0.2) { x = x0 + J(0.008); y = sy(cd[3]) + (sy(cd[2]) - sy(cd[3])) * R(); z = J(0.008); }
      else {
        x = x0 + J(bw); y = o + (c - o) * R(); z = J(bw);
        const s = R();
        if (s < 0.3) x = x0 + (R() < 0.5 ? -1 : 1) * bw / 2;
        else if (s < 0.6) z = (R() < 0.5 ? -1 : 1) * bw / 2;
      }
      if (up) put(f, i, x, y, z, 0.25, 0.95, 0.7, (k + 0.5) / K);
      else put(f, i, x, y, z, 1.0, 0.38, 0.42, (k + 0.5) / K);
    }
  }

  /* ---------- form 2: a double helix ---------- */
  function buildHelix(f) {
    const hh = Math.max(0.6, Math.min(ay * 0.6, 1.1)), turns = hh > 0.9 ? 3.5 : 2.5, Rh = 0.3;
    const nr = Math.round(turns * 10);
    for (let i = 0; i < N; i++) {
      const s = R();
      if (s < 0.76) {
        const u = R(), a = u * turns * TAU + (s < 0.38 ? 0 : Math.PI);
        const x = Math.cos(a) * Rh + J(0.02), y = (u - 0.5) * 2 * hh + J(0.012), z = Math.sin(a) * Rh + J(0.02);
        if (s < 0.38) put(f, i, x, y, z, 0.3, 0.85, 1.0, u);
        else put(f, i, x, y, z, 0.86, 0.46, 1.0, u);
      } else {
        const j = (R() * nr) | 0, u = (j + 0.5) / nr, a = u * turns * TAU, w = R() * 2 - 1;
        const x = Math.cos(a) * Rh * w, y = (u - 0.5) * 2 * hh + J(0.006), z = Math.sin(a) * Rh * w;
        if (w < 0) put(f, i, x, y, z, 0.5, 0.62, 0.8, u);
        else put(f, i, x, y, z, 0.7, 0.52, 0.8, u);
      }
    }
  }

  /* ---------- form 3: a ring of linked blocks, each showing one NFT as a particle mosaic ---------- */

    if (apeView.resize) apeView.resize();
  }
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => resize(true), 180); });
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if (!document.hidden) { last = 0; raf = requestAnimationFrame(frame); }
  });

  function start() {
    glyph = sampleWord();
    if (gl) initGL();
    resize(true);
    initApe();
    const f = forms[0];
    for (let i = 0, j = 0; i < N; i++, j += 3) {
      if (reduce) { pos[j] = f.t[j]; pos[j + 1] = f.t[j + 1]; pos[j + 2] = f.t[j + 2]; }
      else {
        const th = Math.random() * TAU, cz = Math.random() * 2 - 1, sz = Math.sqrt(1 - cz * cz), r = 0.4 + Math.random() * 2.2;
        pos[j] = r * sz * Math.cos(th); pos[j + 1] = r * sz * Math.sin(th); pos[j + 2] = r * cz;
      }
      cb[j] = f.c[j]; cb[j + 1] = f.c[j + 1]; cb[j + 2] = f.c[j + 2];
    }
    cohesion = reduce ? 1 : 0.02;
    raf = requestAnimationFrame(frame);
  }
  const fontReady = (document.fonts && document.fonts.load)
    ? document.fonts.load('800 120px "Unbounded"', 'krippy').catch(() => {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1800))]).then(start, start);
})();
</script>
