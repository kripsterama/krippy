<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Krippy: enterprise AI executive and crypto native.">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>krippy.ai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Unbounded:wght@500;700;800&display=swap">
<style>
/* Layout: one full-bleed particle field that reacts to the pointer; name top-left, links top-right,
   caption and form switches pinned bottom-left. Single dark look by design. */
:root {
  --ink: #08070f;
  --fg: #f3eefb;
  --muted: #a8a0bc;
  --line: rgba(243, 238, 251, 0.18);
  --amber: #ffb957;
  --rose: #ff5d8f;
  --font-display: "Unbounded", "Arial Black", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
html { touch-action: none; overscroll-behavior: none; }
body {
  background: var(--ink);
  color: var(--fg);
  font-family: var(--font-mono);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
#field { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#ape {
  position: fixed; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
  opacity: 0; transition: opacity 0.7s;
  -webkit-mask-image: linear-gradient(to bottom, #000 52%, transparent 74%);
  mask-image: linear-gradient(to bottom, #000 52%, transparent 74%);
}
#ape.show { opacity: 1; }
#ape { z-index: 1; }
/* NFT frames orbit the ape: each frame is placed on its own so it can pass behind (z 0) or in front (z 2) of him */
.nft {
  position: fixed; left: 0; top: 0; margin: 0; box-sizing: border-box; padding: 5px;
  background: #120f1c; border: 1px solid rgba(255, 185, 87, 0.55);
  box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
  pointer-events: none; visibility: hidden; opacity: 0;
}
.nft img { display: block; width: 100%; height: 100%; max-width: 100%; }
.gallery {
  position: fixed; inset: 0; pointer-events: none; overflow: hidden;
  opacity: 0; transition: opacity 0.7s; perspective: 1000px; visibility: hidden;
}
.gallery.show { opacity: 1; }
.wall { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
.frame {
  position: absolute; left: 0; top: 0; margin: 0; box-sizing: border-box;
  padding: 7px; background: #120f1c;
  border: 1px solid rgba(255, 185, 87, 0.55);
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 0 36px rgba(255, 93, 143, 0.14);
  backface-visibility: hidden;
}
.frame img { display: block; width: 100%; height: 100%; max-width: 100%; }
.vignette {
  position: fixed; inset: 0; pointer-events: none;
  background:
    linear-gradient(to top, rgba(8, 7, 15, 0.88), rgba(8, 7, 15, 0) 40%),
    radial-gradient(ellipse at 50% 45%, rgba(8, 7, 15, 0) 55%, rgba(8, 7, 15, 0.7) 100%);
}
.shell {
  position: relative; z-index: 2; height: 100%;
  display: flex; flex-direction: column; justify-content: space-between;
  padding-block: 20px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  -webkit-user-select: none; user-select: none;
}
.shell a, .shell button { pointer-events: auto; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.mark { font-family: var(--font-display); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em; }
.mark span { color: var(--amber); }
.links { display: flex; flex-wrap: wrap; column-gap: 18px; row-gap: 0; }
.links a {
  color: var(--muted); text-decoration: none; font-size: 0.75rem;
  text-transform: uppercase; letter-spacing: 0.1em; padding: 12px 0;
  transition: color 0.2s;
}
.links a:hover { color: var(--fg); }
.bottom { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.caption { max-width: 34rem; min-width: 0; transition: opacity 0.22s, transform 0.22s; }
.caption.swap { opacity: 0; transform: translateY(6px); }
.eyebrow { margin: 0 0 8px; color: var(--amber); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.14em; }
h1 {
  margin: 0 0 10px; font-family: var(--font-display); font-weight: 500;
  font-size: clamp(1.5rem, 5.2vw, 2.75rem); line-height: 1.08; letter-spacing: -0.01em;
  text-wrap: balance;
}
.line { margin: 0; color: var(--fg); opacity: 0.86; font-size: 0.9rem; line-height: 1.55; }
.go {
  display: inline-block; margin-top: 12px; padding: 10px 0; color: var(--amber);
  font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.1em;
  text-decoration: none; border-bottom: 1px solid var(--amber);
}
.go[hidden] { display: none; }
.go:hover { color: var(--fg); border-bottom-color: var(--fg); }
.forms { display: flex; flex-wrap: wrap; column-gap: 20px; row-gap: 0; }
.forms button {
  appearance: none; background: none; border: 0; border-top: 2px solid var(--line);
  color: var(--muted); font: 500 0.72rem var(--font-mono);
  text-transform: uppercase; letter-spacing: 0.1em;
  padding: 12px 0 10px; min-height: 44px; cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.forms button:hover { color: var(--fg); }
.forms button.toggle {
  display: inline-flex; align-items: center; justify-content: flex-end; margin-left: auto;
  min-width: 44px; border-top-color: transparent; opacity: 0.6;
}
.forms button.toggle:hover { opacity: 1; }
.forms button[aria-pressed="true"] { color: var(--fg); border-top-color: var(--amber); }
.shell a:focus-visible, .shell button:focus-visible { outline: 2px solid var(--amber); outline-offset: 4px; }
.play {
  appearance: none; margin-top: 14px; display: inline-flex; align-items: center; gap: 10px;
  padding: 0 18px; min-height: 44px; border: 1px solid var(--amber); border-radius: 999px;
  background: rgba(255, 185, 87, 0.12); color: var(--amber); cursor: pointer;
  font: 600 0.8rem var(--font-mono); text-transform: uppercase; letter-spacing: 0.12em;
  transition: background 0.2s, color 0.2s;
}
.play:hover { background: var(--amber); color: var(--ink); }
.play:focus-visible { outline: 2px solid var(--amber); outline-offset: 3px; }
body.playing #field { cursor: none; }
.hint { margin: 0; color: var(--muted); font-size: 0.72rem; letter-spacing: 0.02em; transition: opacity 0.6s; }
.hint.gone { opacity: 0; }
@media (prefers-reduced-motion: reduce) {
  .caption, .hint, .links a, .forms button { transition: none; }
}
</style>

</head>
<body>
<canvas id="field" aria-hidden="true"></canvas>
<canvas id="ape" aria-hidden="true"></canvas>
<div class="orbit" id="orbit">
  <figure class="nft"><img src="nft/n1.webp" alt="NFT: a portrait with teal hair on a yellow ground" width="360" height="360"></figure>
  <figure class="nft"><img src="nft/n2.webp" alt="NFT: a one-eyed character in a camouflage hat" width="360" height="360"></figure>
  <figure class="nft"><img src="nft/n3.webp" alt="NFT: a flying robot carrying two speakers" width="360" height="360"></figure>
  <figure class="nft"><img src="nft/n4.webp" alt="NFT: a pixel-art Noun with pink glasses" width="360" height="360"></figure>
  <figure class="nft"><img src="nft/n5.webp" alt="NFT: a chrome robot with red LED eyes" width="360" height="360"></figure>
  <figure class="nft"><img src="nft/n6.webp" alt="NFT: a cartoon dancer in a cap and sunglasses" width="360" height="360"></figure>
</div>
<div class="gallery" id="gallery">
  <div class="wall" id="wall">
    <figure class="frame"><img src="art/u1.webp" alt="Unbounded Collective portrait: a farmer in a straw hat and overalls" width="560" height="560"></figure>
    <figure class="frame"><img src="art/u2.webp" alt="Unbounded Collective portrait: a musician with purple hair and gold headphones" width="560" height="560"></figure>
    <figure class="frame"><img src="art/u3.webp" alt="Unbounded Collective portrait: a painter holding a brush at sunset" width="560" height="560"></figure>
    <figure class="frame"><img src="art/u4.webp" alt="Unbounded Collective portrait: a doctor with a stethoscope" width="560" height="560"></figure>
    <figure class="frame"><img src="art/u5.webp" alt="Unbounded Collective portrait: a chef in a white hat" width="560" height="560"></figure>
  </div>
</div>
<div class="vignette"></div>

<div class="shell">
  <header class="top">
    <div class="mark">krippy<span>.ai</span></div>
    <nav class="links" aria-label="Profiles">
      <a href="https://www.linkedin.com/in/anil-kripalani/" target="_blank" rel="noopener">LinkedIn ↗</a>
      <a href="https://github.com/kripsterama" target="_blank" rel="noopener">GitHub ↗</a>
    </nav>
  </header>

  <div class="bottom">
    <div class="caption" id="caption" aria-live="polite">
      <p class="eyebrow" id="eyebrow">Hello, I'm</p>
      <h1 id="title">Krippy</h1>
      <p class="line" id="line">Enterprise AI executive and crypto native.</p>
      <a class="go" id="go" href="https://kripsterama.github.io/musicbox/" target="_blank" rel="noopener" hidden>Open Music Box ↗</a>
      <button type="button" class="play" id="play">Play Starfall <span aria-hidden="true">▶</span></button>
    </div>
    <div class="forms" role="group" aria-label="Change the form">
      <button type="button" id="form-0" data-i="0" aria-pressed="true">krippy</button>
      <button type="button" id="form-1" data-i="1" aria-pressed="false">on-chain</button>
      <button type="button" id="form-2" data-i="2" aria-pressed="false">art</button>
      <button type="button" id="form-3" data-i="3" aria-pressed="false">music box</button>
      <button type="button" class="toggle" id="auto-toggle" aria-label="Pause auto-advance" title="Pause auto-advance"><svg viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path id="auto-icon" d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg></button>
    </div>
    <p class="hint" id="hint">Tap the word to play Starfall, or move to stir it.</p>
  </div>
</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
  const canvas = document.getElementById('field');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2, D = 3.4, CY = 0.46;
  const BG = [8 / 255, 7 / 255, 15 / 255];

  let gl = null, ctx2 = null;
  try {
    gl = canvas.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  } catch (e) { gl = null; }
  if (!gl) ctx2 = canvas.getContext('2d');
  let glLost = false;
  canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); glLost = true; });
  canvas.addEventListener('webglcontextrestored', () => { initGL(); glLost = false; clearAll(); });

  const small = Math.min(innerWidth, innerHeight) < 700 || matchMedia('(pointer: coarse)').matches;
  const N = gl ? (small ? 16000 : 38000) : 5000;
  const MIN_ACTIVE = Math.min(N, small ? 6000 : 9000);
  let active = N;

  const pos = new Float32Array(N * 3), vel = new Float32Array(N * 3);
  const col = new Float32Array(N * 3), cb = new Float32Array(N * 3);
  const rnd = new Float32Array(N), size = new Float32Array(N);
  for (let i = 0; i < N; i++) { rnd[i] = Math.random(); const r = Math.random(); size[i] = 1.2 + r * r * r * 2.8; }

  let W = 1, H = 1, DPR = 1, S = 1, ax = 1, ay = 1;

  /* ---------- copy for each form ---------- */
  const forms = [
    { eyebrow: "Hello, I'm", title: 'Krippy', line: 'Enterprise AI executive and crypto native.', flat: true, pitch: 0, ps: 0.12, pa: 1.2 },
    { eyebrow: 'Since 2013', title: 'On-chain', line: 'Hands-on in crypto for over a decade: DeFi lending and NFTs.', url: 'https://ethglobal.com/showcase/nightwatch-xy8rt', cta: 'See NightWatch, my ETHOnline 2026 build ↗', flat: true, pitch: 0, sway: 0.1, ps: 0.14, pa: 2.2 },
    { eyebrow: 'Unbounded Collective', title: 'Art', line: '88 portraits, each one of a kind. As featured on a Times Square billboard.', url: 'https://opensea.io/collection/unbounded-collective', cta: 'Collect one on OpenSea ↗', flat: true, pitch: 0, sway: 0.05, hold: 16, ps: 0.1, pa: 1.6 },
    { eyebrow: 'Now playing', title: 'Music Box', line: 'Tap to start the music. It already has a seat in music therapy sessions.', url: 'https://kripsterama.github.io/musicbox/', cta: 'Open Music Box ↗', flat: true, pitch: 0.3, ps: 0.3, pa: 2.4 }
  ];
  forms.forEach(f => { f.t = new Float32Array(N * 3); f.c = new Float32Array(N * 3); f.p = new Float32Array(N); });

  const put = (f, i, x, y, z, r, g, b, ph) => {
    const j = i * 3;
    f.t[j] = x; f.t[j + 1] = y; f.t[j + 2] = z;
    f.c[j] = r; f.c[j + 1] = g; f.c[j + 2] = b;
    f.p[i] = ph;
  };
  const R = Math.random;
  const J = a => (R() - 0.5) * a;

  /* ---------- form 0: the wordmark, sampled from real type ---------- */
  let glyph = null;
  function sampleWord() {
    const cw = 1400, ch = 520, c = document.createElement('canvas');
    c.width = cw; c.height = ch;
    const g = c.getContext('2d', { willReadFrequently: true });
    const fam = '"Unbounded", "Arial Black", Impact, sans-serif';
    let fs = 300;
    g.font = `800 ${fs}px ${fam}`;
    const m = g.measureText('krippy').width || 1;
    fs = Math.floor(fs * Math.min(1, (cw - 80) / m));
    g.font = `800 ${fs}px ${fam}`;
    g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = '#fff';
    g.fillText('krippy', cw / 2, ch * 0.62);
    const d = g.getImageData(0, 0, cw, ch).data;
    const xs = [], ys = [];
    let x0 = cw, x1 = 0, y0 = ch, y1 = 0;
    for (let y = 0; y < ch; y += 2) for (let x = 0; x < cw; x += 2) {
      if (d[(y * cw + x) * 4 + 3] > 128) {
        xs.push(x); ys.push(y);
        if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
    if (xs.length < 50) return null;
    const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2, hw = (x1 - x0) / 2;
    const pts = new Float32Array(xs.length * 2);
    for (let i = 0; i < xs.length; i++) { pts[i * 2] = (xs[i] - cx) / hw; pts[i * 2 + 1] = -(ys[i] - cy) / hw; }
    return pts;
  }
  function buildWord(f) {
    const hw = Math.min(ax * 0.86, 1.3);
    const A = [1.0, 0.72, 0.28], B = [1.0, 0.32, 0.56], C = [0.56, 0.42, 1.0];
    const n = glyph ? glyph.length / 2 : 0;
    for (let i = 0; i < N; i++) {
      let nx, ny;
      if (n) { const k = (R() * n) | 0; nx = glyph[k * 2]; ny = glyph[k * 2 + 1]; }
      else { const a = R() * TAU; nx = Math.cos(a) * 0.5; ny = Math.sin(a) * 0.5; }
      const u = (nx + 1) / 2;
      let r, g, b;
      if (u < 0.5) { const t = u * 2; r = A[0] + (B[0] - A[0]) * t; g = A[1] + (B[1] - A[1]) * t; b = A[2] + (B[2] - A[2]) * t; }
      else { const t = (u - 0.5) * 2; r = B[0] + (C[0] - B[0]) * t; g = B[1] + (C[1] - B[1]) * t; b = B[2] + (C[2] - B[2]) * t; }
      put(f, i, nx * hw + J(0.006), ny * hw + J(0.006), J(0.07), r, g, b, u);
    }
  }

  /* ---------- the ape: the real 3D model, drawn on its own canvas over the particle field ---------- */
  const apeCanvas = document.getElementById('ape');
  const apeView = { ready: false, shown: false, loading: false, off: -9, tick: null, resize: null };
  /* how the camera frames the bust: visible height in model units, and the model height at screen centre */
  function apeFrame() {
    const aspect = W / H, vh = Math.max(1.53, 1.06 / aspect);
    return { vh, ty: 2.08 - (0.5 - (aspect < 1 ? 0.22 : 0.12)) * vh };
  }
  function initApe() {
    if (!window.THREE || !THREE.GLTFLoader) return;
    let renderer;
    try { renderer = new THREE.WebGLRenderer({ canvas: apeCanvas, alpha: true, antialias: true, powerPreference: 'high-performance' }); } catch (e) { return; }
    apeView.loading = true;
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(28, 1, 0.1, 60);
    scene.add(new THREE.HemisphereLight(0x9a90d6, 0x15101f, 0.8));
    const key = new THREE.DirectionalLight(0xffe6c4, 1.55); key.position.set(-1.6, 2.6, 3); scene.add(key);
    const rimA = new THREE.DirectionalLight(0xff5d8f, 1.7); rimA.position.set(2.6, 1.2, -2.2); scene.add(rimA);
    const rimB = new THREE.DirectionalLight(0x7d6bff, 1.7); rimB.position.set(-2.6, 1.6, -2.2); scene.add(rimB);
    const pivot = new THREE.Group(); scene.add(pivot);
    const Xa = new THREE.Vector3(1, 0, 0), Ya = new THREE.Vector3(0, 1, 0), Za = new THREE.Vector3(0, 0, 1);
    const pq = new THREE.Quaternion(), wq = new THREE.Quaternion();
    /* rotate a bone about an axis given in world space */
    const turn = (bone, axis, ang) => {
      bone.parent.getWorldQuaternion(pq);
      wq.setFromAxisAngle(axis, ang);
      bone.quaternion.premultiply(pq.clone().invert().multiply(wq).multiply(pq));
    };
    apeView.resize = () => {
      const fr = apeFrame();
      renderer.setPixelRatio(Math.max(0.75, Math.min(DPR, Math.sqrt(3.2e6 / (W * H))))); renderer.setSize(W, H, false);
      cam.aspect = W / H; cam.position.set(0, fr.ty, fr.vh / (2 * Math.tan(14 * Math.PI / 180)));
      cam.lookAt(0, fr.ty, 0); cam.updateProjectionMatrix();
    };
    /* the model ships as base64 in ape-model.js, loaded after the page is up */
    const tag = document.createElement('script');
    tag.src = 'ape-model.js'; tag.async = true;
    tag.onload = () => {
      const b64 = window.APE_GLB; if (!b64) { apeView.loading = false; return; }
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      window.APE_GLB = null;
      const buf = bytes.buffer;
      new THREE.GLTFLoader().parse(buf, '', gltf => {
        const model = gltf.scene; pivot.add(model);
        model.traverse(o => { if (o.isMesh) o.frustumCulled = false; });
        model.updateMatrixWorld(true);
        const wp = new THREE.Vector3();
        ['upperarm_l', 'upperarm_r'].forEach(n => {          /* out of the T-pose: arms down at his sides */
          const bn = model.getObjectByName(n); if (!bn) return;
          bn.getWorldPosition(wp); turn(bn, Za, wp.x > 0 ? -1.2 : 1.2);
        });
        model.updateMatrixWorld(true);
        const head = model.getObjectByName('head'), neck = model.getObjectByName('neck_01');
        const headRest = head && head.quaternion.clone(), neckRest = neck && neck.quaternion.clone();
        let lx = 0, ly = 0;
        apeView.resize();
        apeView.tick = dt => {
          const want = cur === 1;
          if (want !== apeView.shown) { apeView.shown = want; apeCanvas.classList.toggle('show', want); if (!want) apeView.off = performance.now(); }
          if (!want && performance.now() - apeView.off > 900) return;
          /* he looks at the pointer; left alone he glances around */
          const tx = ptr.power > 0.05 ? ptr.nx * 0.6 : (reduce ? 0 : 0.28 * Math.sin(time * 0.55));
          const ty = ptr.power > 0.05 ? ptr.ny * 0.32 : (reduce ? 0 : 0.06 * Math.sin(time * 0.8));
          lx += (tx - lx) * Math.min(1, dt * 4); ly += (ty - ly) * Math.min(1, dt * 4);
          pivot.rotation.y = lx * 0.35 + (reduce ? 0 : 0.08 * Math.sin(time * 0.4));
          if (neck) { neck.quaternion.copy(neckRest); turn(neck, Ya, lx * 0.35); }
          if (head) { head.quaternion.copy(headRest); turn(head, Ya, lx * 0.65); turn(head, Xa, ly); }
          renderer.render(scene, cam);
        };
        apeView.ready = true; apeView.loading = false;
      }, () => { apeView.loading = false; });
    };
    tag.onerror = () => { apeView.loading = false; };
    document.head.appendChild(tag);
  }

  /* ---------- the art gallery: five framed portraits on a curved wall (CSS 3D) ---------- */
  const elGallery = document.getElementById('gallery'), elWall = document.getElementById('wall');
  const frames = [...elWall.querySelectorAll('.frame')];
  const ART = 2;
  const gal = { fw: 200, R: 900, step: 0.2, maxPan: 0.2, pan: 0, tilt: 0, off: 0, shown: false, phone: false, top: 0.46 };
  function layoutGallery() {
    const phone = gal.phone = W < 640;
    gal.fw = Math.round(phone ? Math.min(W * 0.56, H * 0.3) : Math.min(W * 0.135, H * 0.3, 240));
    gal.R = Math.max(W * (phone ? 1.3 : 1.25), gal.fw * 4.2);
    gal.step = gal.fw * 1.17 / gal.R;
    gal.maxPan = phone ? gal.step * 2 : gal.step * 0.3;
    /* phones carry a taller caption, so the wall sits higher there */
    gal.top = phone ? 0.36 : 0.43;
    elGallery.style.perspective = Math.round(gal.R * 1.15) + 'px';
    elWall.style.top = (gal.top * 100) + '%';
    frames.forEach(fr => { fr.style.width = fr.style.height = gal.fw + 'px'; });
  }
  function tickGallery(dt) {
    const want = cur === ART;
    if (want !== gal.shown) {
      gal.shown = want; gal.off = performance.now();
      if (want) { gal.pan = 0; elGallery.style.visibility = 'visible'; }

    if (game.active) { ex = ey = evx = evy = 0; ePow = 0; }
    else if (ptr.power > 0.05) {
      ex = (ptr.x - W / 2) / S; ey = -(ptr.y - H * CY) / S; evx = ptr.vx; evy = ptr.vy; ePow = ptr.power;
    } else {
      ex = ax * 0.6 * Math.sin(time * 0.37); ey = Math.min(ay, 1) * 0.4 * Math.sin(time * 0.53 + 1);
      evx = 0; evy = 0; ePow = ghost;
    }

    const cyw = Math.cos(yaw), syw = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
    const k0 = 26 * cohesion * cohesion + 0.6, flowA = reduce ? 0 : (f.rigid ? 0.03 : 0.1) + (1 - cohesion) * 2.4;
    const damp = Math.exp(-4.6 * dt), cl = Math.min(1, dt * 3);
    const t1 = time * 0.7, t2 = time * 0.5, t3 = time * 0.6;
    const fadeA = 1 - Math.pow(0.68, dt * 60), GS = G0 * fadeA / 0.32 * Math.min(1.7, Math.sqrt(N / active)), zf = !!f.fade, rg = !!f.rigid, nm = f.nrm || null;
    const PR = 0.42, R2 = PR * PR, T = f.t, Cc = f.c, P = f.p, ps = time * f.ps, pa = reduce ? 0 : f.pa;

    const gOn = game.active && !game.over;
    for (let i = 0, j = 0; i < active; i++, j += 3) {
      if (gOn && i < RES) continue;
      const X = T[j], Y = T[j + 1], Z = T[j + 2];
      const x1 = X * cyw + Z * syw, z1 = -X * syw + Z * cyw;
      const ty = Y * cp - z1 * sp, tz = Y * sp + z1 * cp;
      let x = pos[j], y = pos[j + 1], z = pos[j + 2];
      if (x !== x || y !== y || z !== z) { x = x1 || 0; y = ty || 0; z = tz || 0; vel[j] = vel[j + 1] = vel[j + 2] = 0; }
      const lz = game.active && loose[i];
      const kk = lz ? 0 : rg ? k0 * 1.3 : k0 * (0.55 + rnd[i] * 0.9);
      let fx = (x1 - x) * kk, fy = (ty - y) * kk, fz = (tz - z) * kk;
      if (flowA) {
        fx += flowA * (Math.sin(y * 2.1 + t1) + Math.cos(z * 1.7 - t2));
        fy += flowA * (Math.sin(z * 2.3 + t3) + Math.cos(x * 1.9 + t2));
        fz += flowA * (Math.sin(x * 2.0 - t1) + Math.cos(y * 2.2 + t3));
      }
      if (ePow > 0.01) {
        const pf = 1 / (1 + z / D), dx = x * pf - ex, dy = y * pf - ey, d2 = dx * dx + dy * dy;
        if (d2 < R2) {

          fx += (dx * inv * 9 - dy * inv * 7 + evx * 2.2) * ff;

          fz += (rnd[i] - 0.5) * 5 * ff;
        }
      }
      const vx = (vel[j] + fx * dt) * damp, vy = (vel[j + 1] + fy * dt) * damp, vz = (vel[j + 2] + fz * dt) * damp;
      vel[j] = vx; vel[j + 1] = vy; vel[j + 2] = vz;
      x += vx * dt; y += vy * dt; z += vz * dt;
      if (z < -D * 0.6) z = -D * 0.6;
      pos[j] = x; pos[j + 1] = y; pos[j + 2] = z;

      let spd = vx * vx + vy * vy + vz * vz; if (spd > 1) spd = 1;
      let g = GS * (0.55 + spd * 1.3);
      if (lz) g *= 0.35;
      if (zf) { const q = (0.5 - z) * 1.4; g *= q > 1 ? 1 : q < 0.18 ? 0.18 : q; }
      let rim = 0;
      if (nm) {
        const l = nm[j] * syw - nm[j + 2] * cyw;
        if (l > 0) { const o = 1 - l; rim = g * o * o * o * 0.3; g *= 0.3 + 0.7 * l; } else g = 0;
      }
      const ph = P[i];
      if (pa && ph >= 0) {
        let s = Math.sin(TAU * (ph - ps));
        if (s > 0) { s *= s; s *= s; s *= s; g *= 1 + pa * s; }
      }
      const w = spd * 0.05;
      col[j] = (cb[j] += (Cc[j] - cb[j]) * cl) * g + w;
      col[j + 1] = (cb[j + 1] += (Cc[j + 1] - cb[j + 1]) * cl) * g + w;
      col[j + 2] = (cb[j + 2] += (Cc[j + 2] - cb[j + 2]) * cl) * g + w;
      if (rim) { col[j] += 0.35 * rim; col[j + 1] += 0.5 * rim; col[j + 2] += rim; }
    }
    if (game.active) tickGame(dt);
    draw(fadeA);
    if (apeView.tick) apeView.tick(dt);
    tickGallery(dt);
    tickOrbit(dt);
  }

  /* ---------- input ---------- */
  const onControl = e => e.target && e.target.closest && e.target.closest('a,button');
  const track = e => {
    const now = performance.now(), dtm = Math.max(8, now - (ptr.lt || now - 16));
    ptr.vx = ptr.vx * 0.6 + ((e.clientX - ptr.x) / S) / (dtm / 1000) * 0.4;
    ptr.vy = ptr.vy * 0.6 - ((e.clientY - ptr.y) / S) / (dtm / 1000) * 0.4;
    ptr.vx = Math.max(-6, Math.min(6, ptr.vx)); ptr.vy = Math.max(-6, Math.min(6, ptr.vy));
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.lt = now; ptr.lastMove = time;
    ptr.nx = (e.clientX / W) * 2 - 1; ptr.ny = (e.clientY / H) * 2 - 1;
  };
  addEventListener('pointermove', e => { ptr.hover = e.pointerType === 'mouse' || ptr.down; track(e); });
  addEventListener('pointerdown', e => {
    if (onControl(e)) return;
    if (game.active) { track(e); return; }
    ptr.x = e.clientX; ptr.y = e.clientY; ptr.vx = ptr.vy = 0; ptr.lt = performance.now();
    ptr.down = true; ptr.sx = e.clientX; ptr.sy = e.clientY; ptr.st = performance.now(); track(e);
  });
  const up = e => {
    if (game.active) { ptr.down = false; return; }
    if (!ptr.down) return;
    ptr.down = false;
    if (e.pointerType !== 'mouse') ptr.hover = false;
    if (e.type === 'pointerup' && Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) < 12 && performance.now() - ptr.st < 450) {
      burst((e.clientX - W / 2) / S, -(e.clientY - H * CY) / S);
      if (cur === 0) startGame(); else setForm(cur + 1, false);
      if (++taps >= 1) elHint.classList.add('gone');
    }
  };
  addEventListener('pointerup', up); addEventListener('pointercancel', up);
  document.addEventListener('pointerleave', () => { ptr.hover = false; });
  btns.forEach(b => b.addEventListener('click', () => { if (game.active) endGame(); setForm(+b.dataset.i, true); elHint.classList.add('gone'); }));
  addEventListener('keydown', e => {
    if (game.active) { if (e.key === 'Escape') endGame(); return; }
    if (e.key === 'ArrowRight') setForm(cur + 1, true);
    else if (e.key === 'ArrowLeft') setForm(cur - 1, true);
  });

  /* ---------- Starfall: the Krippy tab is the game ----------
     Stars fall toward the wordmark. Your pointer is a shield that knocks them away.
     A star that gets through blasts a crater in the letters; knocking stars away rebuilds them.
     The comets, the shield and the sparks are drawn with a reserved slice of the field's own particles. */
  const elPlay = document.getElementById('play');
  const RES = Math.min(1600, Math.floor(MIN_ACTIVE * 0.18));
  const loose = new Uint8Array(N);
  const game = { active: false, over: false };
  let GM = null;
  const BEST_KEY = 'krippy-starfall-best';
  const loadBest = () => { try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } };
  const saveBest = v => { try { localStorage.setItem(BEST_KEY, String(v)); } catch (e) {} };
  const fmt = n => Math.round(n).toLocaleString('en-US');
  const touchFirst = matchMedia('(pointer: coarse)').matches;
  const PLAY_LABEL = 'Play Starfall <span aria-hidden="true">▶</span>';
  /* the reserved particles draw a little larger while they are stars, shield and sparks */
  const sizeKeep = size.slice(0, RES);
  function reservedSize(big) {
    for (let i = 0; i < RES; i++) size[i] = big ? 2.6 + Math.random() * 2.4 : sizeKeep[i];
    if (gl && bufSize && !glLost) { gl.bindBuffer(gl.ARRAY_BUFFER, bufSize); gl.bufferData(gl.ARRAY_BUFFER, size, gl.STATIC_DRAW); }
  }

  function startGame() {
    if (cur !== 0) setForm(0, false);
    loose.fill(0);
    reservedSize(true);
    game.active = true; game.over = false;
    GM = {
      t: 0, score: 0, streak: 0, bestStreak: 0, mult: 1, best: loadBest(),
      comets: [], sparks: [], spawnT: 1.4, goldT: 16 + Math.random() * 6,
      deflects: 0, combos: 0, lost: 0, healQ: 0, healPtr: RES, overT: 0, sweep: -9, hudT: 0,
      wordN: Math.max(1, active - RES), hitFlash: 0
    };
    elCap.setAttribute('aria-live', 'off');
    elPlay.textContent = 'Stop';
    elGo.hidden = true;
    elHint.classList.add('gone');
    document.body.classList.add('playing');
    updateGameHud(true);
  }
  function endGame() {
    if (!game.active) return;
    /* a score counts however the game ends: Stop, Esc or a tab switch, not only when the word falls */
    if (GM && !game.over && GM.score > loadBest()) saveBest(Math.round(GM.score));
    game.active = false; game.over = false; GM = null;
    reservedSize(false);
    document.body.classList.remove('playing');
    loose.fill(0);
    elCap.setAttribute('aria-live', 'polite');
    lastSwitch = time;
    showCaption(cur);
  }
  function gameOver() {
    const g = GM;
    game.over = true; g.overT = 0;
    reservedSize(false);
    for (const c of g.comets) burstSparks(c.x, c.y, 16, c.defl ? 'cool' : 'hot');
    g.comets = [];
    const isNew = g.score > g.best;
    if (isNew) saveBest(Math.round(g.score));
    elEye.textContent = isNew ? 'New best · the word fell' : 'The word fell';
    elTitle.textContent = fmt(g.score);
    const secs = Math.floor(g.t);
    elLine.textContent = `${g.deflects} stars knocked away · best streak ${g.bestStreak} · ${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}` +
      (isNew ? '' : ` · best ${fmt(g.best)}`);
    elPlay.innerHTML = 'Play again <span aria-hidden="true">▶</span>';
    elCap.setAttribute('aria-live', 'polite');
  }
  elPlay.addEventListener('click', () => {
    if (!game.active || game.over) startGame(); else endGame();
  });

  function updateGameHud(force) {
    const g = GM;
    if (!g || game.over) return;
    if (!force && (g.hudT += 1) % 6) return;
    const health = Math.max(0, Math.round((1 - g.lost / g.wordN) * 100));
    elEye.textContent = 'Starfall · best ' + fmt(Math.max(g.best, g.score));
    elTitle.textContent = fmt(g.score);
    elLine.textContent = g.t < 4
      ? (touchFirst ? 'Stars are falling on the word. Drag to knock them away.' : 'Stars are falling on the word. Move to knock them away.')
      : `Word ${health}%` + (g.mult > 1 ? ` · ×${g.mult} streak` : '') + (g.hitFlash > 0 ? ' · hit!' : '');
  }

  /* screen pixels to field units, and the shield's size */
  const shieldR = () => Math.max(30, Math.min(48, S * 0.1)) / S;
  const cometR = () => 13 / S;

  function pickTarget() {
    for (let tries = 0; tries < 30; tries++) {
      const k = RES + ((Math.random() * (active - RES)) | 0);
      if (!loose[k]) return [pos[k * 3], pos[k * 3 + 1]];
    }
    return [0, 0];
  }
  function spawnComet(kind) {
    const g = GM, hwF = W / 2 / S, top = H * CY / S;
    let x, y;
    const r = Math.random();
    if (r < 0.5) { x = (Math.random() * 2 - 1) * hwF; y = top + 30 / S; }
    else if (r < 0.75) { x = -hwF - 30 / S; y = (Math.random() * 0.9 + 0.1) * top; }
    else { x = hwF + 30 / S; y = (Math.random() * 0.9 + 0.1) * top; }
    const [tx, ty] = pickTarget();
    const spdPx = Math.min(560, 160 + g.t * 3.4) * (kind === 'gold' ? 0.85 : 1);
    const dx = tx - x, dy = ty - y, L = Math.hypot(dx, dy) || 1, v = spdPx / S;
    g.comets.push({
      kind, x, y, bx: x, by: y, vx: dx / L * v, vy: dy / L * v, tx, ty, L0: L, age: 0,
      px: -dy / L, py: dx / L, A: (34 + Math.random() * 30) / S, w: 3 + Math.random() * 2, ph: Math.random() * 6,
      defl: false, split: false, trail: []
    });
  }
  function burstSparks(x, y, n, tone) {
    const g = GM;
    for (let k = 0; k < n && g.sparks.length < RES - 700; k++) {
      const a = Math.random() * TAU, v = (60 + Math.random() * 260) / S;
      const c = tone === 'hot' ? [3, 0.7 + Math.random() * 0.6, 0.3] : tone === 'gold' ? [3, 2.3, 0.6] : [1, 2.1, 3];
      g.sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.4 + Math.random() * 0.5, max: 0.9, c });
    }
  }
  function crater(cx, cy) {
    const g = GM, hwW = Math.min(ax * 0.86, 1.3), Rc = hwW * 0.07, R2c = Rc * Rc;
    for (let i = RES, j = RES * 3; i < active; i++, j += 3) {
      if (loose[i]) continue;
      const dx = pos[j] - cx, dy = pos[j + 1] - cy, d2 = dx * dx + dy * dy;
      if (d2 < R2c) {
        loose[i] = 1; g.lost++;
        const d = Math.sqrt(d2) + 1e-3, kick = 0.6 + Math.random() * 1.2;
        vel[j] += dx / d * kick; vel[j + 1] += dy / d * kick; vel[j + 2] += (Math.random() - 0.5) * 2;
      }
    }
    burstSparks(cx, cy, 34, 'hot');
    g.streak = 0; g.mult = 1; g.hitFlash = 0.7;
  }
  function heal(dt) {
    const g = GM;
    if (g.healQ <= 0 || g.lost <= 0) { g.healQ = 0; return; }
    let n = Math.min(260, Math.ceil(g.healQ * g.wordN * Math.min(1, dt * 6)));
    g.healQ -= n / g.wordN;
    for (let scan = 0; n > 0 && scan < active; scan++) {
      if (++g.healPtr >= active) g.healPtr = RES;
      if (loose[g.healPtr]) { loose[g.healPtr] = 0; g.lost--; n--; }
    }
  }

  /* one game step, after the word particles have moved; writes the reserved particles */
  function tickGame(dt) {
    const g = GM;
    g.t += dt;
    if (g.hitFlash > 0) g.hitFlash -= dt;
    const sx = (ptr.x - W / 2) / S, sy = -(ptr.y - H * CY) / S, sR = shieldR(), cR = cometR();
    const outX = W / 2 / S + 0.4, outY = H / S;

    if (!game.over) {
      if ((g.spawnT -= dt) <= 0) {
        const r = Math.random();
        const kind = g.t > 40 && r < 0.2 ? 'split' : g.t > 20 && r < 0.5 ? 'curve' : 'plain';
        spawnComet(kind);
        if (g.t > 55 && Math.random() < 0.3) spawnComet('plain');
        g.spawnT = Math.max(0.38, 1.5 - g.t * 0.014);
      }
      if ((g.goldT -= dt) <= 0) { spawnComet('gold'); g.goldT = 18 + Math.random() * 8; }

      const add = [];
      g.comets = g.comets.filter(c => {
        c.age += dt;
        if (!c.defl) {
          c.bx += c.vx * dt; c.by += c.vy * dt;
          const remain = Math.hypot(c.tx - c.bx, c.ty - c.by);
          if (c.kind === 'curve') {
            const fade = Math.min(1, remain / (c.L0 * 0.35));
            const o = Math.sin(c.age * c.w + c.ph) * c.A * fade;
            c.x = c.bx + c.px * o; c.y = c.by + c.py * o;
          } else { c.x = c.bx; c.y = c.by; }
          if (c.kind === 'split' && !c.split && remain < c.L0 * 0.55) {
            c.split = true;
            for (let s = 0; s < 2; s++) {
              const [tx, ty] = pickTarget(), dx = tx - c.x, dy = ty - c.y, L = Math.hypot(dx, dy) || 1, v = Math.hypot(c.vx, c.vy);
              add.push({ kind: 'plain', x: c.x, y: c.y, bx: c.x, by: c.y, vx: dx / L * v, vy: dy / L * v, tx, ty, L0: L, age: 0, px: 0, py: 0, A: 0, w: 0, ph: 0, defl: false, split: true, trail: [] });
            }
            burstSparks(c.x, c.y, 10, 'hot');
            return false;
          }
          /* the shield */
          const dx = c.x - sx, dy = c.y - sy, d = Math.hypot(dx, dy);
          if (d < sR + cR) {
            const nx = dx / (d || 1), ny = dy / (d || 1), dot = c.vx * nx + c.vy * ny;
            if (dot < 0) { c.vx -= 2 * dot * nx; c.vy -= 2 * dot * ny; }
            c.vx = c.vx * 1.35 + ptr.vx * 0.5; c.vy = c.vy * 1.35 + ptr.vy * 0.5;
            const sp = Math.hypot(c.vx, c.vy), minV = 520 / S;
            if (sp < minV) { c.vx *= minV / sp; c.vy *= minV / sp; }
            c.x = sx + nx * (sR + cR + 0.002); c.y = sy + ny * (sR + cR + 0.002);
            c.defl = true;
            g.streak++; g.deflects++;
            if (g.streak > g.bestStreak) g.bestStreak = g.streak;
            g.mult = Math.min(6, 1 + Math.floor(g.streak / 4));
            g.score += (c.kind === 'gold' ? 100 : 10) * g.mult;
            g.healQ += c.kind === 'gold' ? 0.08 : 0.012;
            burstSparks(c.x, c.y, c.kind === 'gold' ? 40 : 16, c.kind === 'gold' ? 'gold' : 'cool');
            return true;
          }
          /* reached the word */
          if (remain < Math.hypot(c.vx, c.vy) * dt + 0.01 || (c.vx * (c.tx - c.bx) + c.vy * (c.ty - c.by)) < 0) {
            crater(c.tx, c.ty);
            return false;
          }
          return true;
        }
        /* a knocked-away star flies on and can take out others */
        c.x += c.vx * dt; c.y += c.vy * dt;
        for (const o of g.comets) {
          if (o === c || o.defl || o.dead) continue;
          if (Math.hypot(o.x - c.x, o.y - c.y) < cR * 3) {
            o.dead = true; g.combos++; g.streak++;
            if (g.streak > g.bestStreak) g.bestStreak = g.streak;
            g.mult = Math.min(6, 1 + Math.floor(g.streak / 4));
            g.score += 30 * g.mult; g.healQ += 0.02;
            burstSparks(o.x, o.y, 26, 'gold');
          }
        }
        return Math.abs(c.x) < outX && c.y < outY && c.y > -outY;
      });
      g.comets = g.comets.filter(c => !c.dead).concat(add);
      heal(dt);
      if (g.lost / g.wordN > 0.45) gameOver();
      updateGameHud(false);
    } else {
      /* after a loss the word rebuilds from left to right, then the tab goes back to normal */
      g.overT += dt;
      if (g.overT > 1.1) {
        g.sweep = -ax + (g.overT - 1.1) * ax * 1.4;
        for (let i = RES, j = RES * 3; i < active; i++, j += 3) if (loose[i] && pos[j] < g.sweep) loose[i] = 0;
      }
      if (g.overT > 14) endGame();
      return;
    }

    /* sparks */
    g.sparks = g.sparks.filter(p => { p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.93; p.vy *= 0.93; return p.life > 0; });

    /* draw: write positions and colours into the reserved particles */
    let k = 0;
    const put3 = (x, y, r, gg, b) => { if (k >= RES) return; const j = k * 3; pos[j] = x; pos[j + 1] = y; pos[j + 2] = 0; vel[j] = vel[j + 1] = vel[j + 2] = 0; col[j] = r; col[j + 1] = gg; col[j + 2] = b; k++; };
    const jit = v => (Math.random() - 0.5) * v;
    if (!game.over) {
      const spin = g.t * 2.2, ringN = 110, glow = 1.3 + 0.3 * Math.sin(g.t * 6);
      for (let q = 0; q < ringN; q++) {
        const a = spin + q / ringN * TAU, rr = sR * (1 + jit(0.08));
        put3(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, 0.35 * glow, 0.95 * glow, 1.3 * glow);
      }
      for (let q = 0; q < 26; q++) { const a = Math.random() * TAU, rr = sR * 0.55 * Math.sqrt(Math.random()); put3(sx + Math.cos(a) * rr, sy + Math.sin(a) * rr, 0.25, 0.5, 0.7); }
    }
    for (const c of g.comets) {
      c.trail.push(c.x, c.y); if (c.trail.length > 40) c.trail.splice(0, 2);
      const hot = c.kind === 'gold' ? [3, 2.3, 0.6] : c.defl ? [1, 2.2, 3.2] : [3.4, 0.8, 0.35];
      const n = c.trail.length / 2;
      for (let q = 0; q < n; q++) {
        const f = q / n;
        for (let r2 = 0; r2 < 2; r2++) put3(c.trail[q * 2] + jit(cR * 1.6 * f), c.trail[q * 2 + 1] + jit(cR * 1.6 * f), hot[0] * f * 0.6, hot[1] * f * 0.6, hot[2] * f * 0.6);
      }
      for (let q = 0; q < 44; q++) { const a = Math.random() * TAU, rr = cR * 1.3 * Math.sqrt(Math.random()); put3(c.x + Math.cos(a) * rr, c.y + Math.sin(a) * rr, hot[0], hot[1], hot[2]); }
      for (let q = 0; q < 8; q++) put3(c.x + jit(cR * 0.5), c.y + jit(cR * 0.5), 3, 3, 3);
    }
    for (const p of g.sparks) { const f = p.life / p.max; put3(p.x, p.y, p.c[0] * f, p.c[1] * f, p.c[2] * f); }
    for (; k < RES; k++) { const j = k * 3; col[j] = col[j + 1] = col[j + 2] = 0; pos[j] = pos[j + 1] = 0; pos[j + 2] = 0; }
  }

  /* ---------- sizing and start ---------- */
  function resize(rebuild) {
    const w0 = canvas.clientWidth || innerWidth, h0 = canvas.clientHeight || innerHeight;
    if (!w0 || !h0) return;
    W = w0; H = h0;
    DPR = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
    S = Math.min(W * 0.44, H * 0.5); ax = W / 2 / S; ay = H / 2 / S;
    layoutGallery();
    layoutOrbit();
    if (rebuild) buildAll();
    clearAll();
    if (apeView.resize) apeView.resize();
  }
  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => resize(true), 180); });
  document.addEventListener('visibilitychange', () => {
    cancelAnimationFrame(raf);
    if (!document.hidden) { last = 0; raf = requestAnimationFrame(frame); }
  });

  function start() {
    glyph = sampleWord();
    if (gl) initGL();
    resize(true);
    initApe();
    const f = forms[0];
    for (let i = 0, j = 0; i < N; i++, j += 3) {
      if (reduce) { pos[j] = f.t[j]; pos[j + 1] = f.t[j + 1]; pos[j + 2] = f.t[j + 2]; }
      else {
        const th = Math.random() * TAU, cz = Math.random() * 2 - 1, sz = Math.sqrt(1 - cz * cz), r = 0.4 + Math.random() * 2.2;
        pos[j] = r * sz * Math.cos(th); pos[j + 1] = r * sz * Math.sin(th); pos[j + 2] = r * cz;
      }
      cb[j] = f.c[j]; cb[j + 1] = f.c[j + 1]; cb[j + 2] = f.c[j + 2];
    }
    cohesion = reduce ? 1 : 0.02;
    raf = requestAnimationFrame(frame);
  }
  const fontReady = (document.fonts && document.fonts.load)
    ? document.fonts.load('800 120px "Unbounded"', 'krippy').catch(() => {}) : Promise.resolve();
  Promise.race([fontReady, new Promise(r => setTimeout(r, 1800))]).then(start, start);
})();
</script>
